[project]
name = "screaming-computer-py"
version = "0.1.0"
description = "A synthesized voice that strains and screams as a system works."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "ipython>=9.15.0",
    "matplotlib>=3.11.0",
    "numpy>=2.4.6",
    "psutil>=7.2.2",
    "python-chess>=1.999",
    "scipy>=1.18.0",
    "sounddevice>=0.5.5",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
